<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Game</title>
</head>
<style>
    body{
        background-color: white;
    }

    #dice{
        font-size: larger;
    }
</style>
<script>
    function disco() {
        setInterval(() => {
            document.body.style.backgroundColor = "rgb(" + 
                Math.floor(Math.random() * 256) + "," + 
                Math.floor(Math.random() * 256) + "," + 
                Math.floor(Math.random() * 256) + ")";
        }, 500); // Change color every 500 milliseconds
    }

    function rollDice() {
        let dice = [4, 6, 8, 10, 10, 12, 20];
        let result = [];
        for (let i = 0; i < dice.length; i++) {
            result.push(Math.floor(Math.random() * dice[i]) + 1);
        }
        result.sort((a, b) => a - b)
        console.log(result);
        document.getElementById("dice").innerHTML = "<p>" + result.join(", ") + "</p>";
        if (result == [1, 2, 3, 4, 5, 6, 7]) {
            disco();
        }
    }
</script>
<body>
    <button onclick="window.location.href='/';">Home</button>
    <button onclick="rollDice()">Roll</button>
    <br>
    <div id="dice">
        <p></p>
    </div>
</body>
</html>
